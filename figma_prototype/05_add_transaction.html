<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>05_add_transaction.html</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Inter", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .mobile-frame {
      width: 390px;
      height: 844px;
      background: #F8FAFC;
      border-radius: 40px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .status-bar {
      height: 44px;
      padding: 0 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      color: #0F172A;
      flex-shrink: 0;
    }
    .status-time { font-weight: 700; }
    .status-icons { display: flex; gap: 6px; font-size: 12px; }
    .screen-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .screen-body::-webkit-scrollbar { display: none; }
    .bottom-nav-bar {
      height: 60px;
      background: #FFFFFF;
      border-top: 1px solid #E2E8F0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-shrink: 0;
      padding: 0 8px;
    }
    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #94A3B8;
      font-size: 10.5px;
      font-weight: 600;
    }
    .nav-tab.active { color: #4F46E5; }
    .nav-tab.active svg { color: #4F46E5; }
    .bottom-home-bar {
      width: 140px;
      height: 5px;
      background: #0F172A;
      border-radius: 10px;
      margin: 4px auto 6px auto;
      flex-shrink: 0;
    }
    </style>
</head>
<body>

    <!-- 05_ADD_TRANSACTION -->
    <div class="mobile-frame" id="frame_05">
      <div class="status-bar">
        <span class="status-time">09:41</span>
        <div class="status-icons"><span>5G</span><span>100%</span></div>
      </div>

      <!-- Centered Header -->
      <div style="padding: 10px 18px; background: #FFF; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E2E8F0;">
        <div style="width: 32px; color: #172033; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg></div>
        <div style="font-size: 16px; font-weight: 800; color: #172033;">Tambah Transaksi</div>
        <div style="width: 32px;"></div>
      </div>

      <div class="screen-body" style="padding: 14px 18px; justify-content: space-between;">
        <div>
          <!-- Type Toggle -->
          <div style="display: flex; gap: 10px; margin-bottom: 16px;">
            <div style="flex: 1; height: 46px; background: #172033; color: #FFF; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13.5px; font-weight: 700;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg> <span>Pengeluaran</span>
            </div>
            <div style="flex: 1; height: 46px; background: #FFF; border: 1.2px solid #E2E8F0; color: #16A34A; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13.5px; font-weight: 700;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg> <span>Pemasukan</span>
            </div>
          </div>

          <!-- Nominal -->
          <div style="margin-bottom: 16px;">
            <label style="font-size: 13px; font-weight: 700; color: #374151; display: block; margin-bottom: 6px;">Nominal</label>
            <div style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 14px; padding: 10px 14px; display: flex; align-items: center;">
              <span style="font-size: 20px; font-weight: 800; color: #172033; margin-right: 4px;">Rp </span>
              <span style="font-size: 22px; font-weight: 800; color: #172033;">75.000</span>
            </div>
          </div>

          <!-- Kategori -->
          <div style="margin-bottom: 16px;">
            <label style="font-size: 13px; font-weight: 700; color: #374151; display: block; margin-bottom: 6px;">Kategori</label>
            <div style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 26px; height: 26px; background: rgba(245,158,11,0.15); border-radius: 7px; display: flex; align-items: center; justify-content: center; color: #F59E0B;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg></div>
                <span style="font-size: 13.5px; font-weight: 600; color: #172033;">Makanan & Minuman</span>
              </div>
              <span style="color: #94A3B8; font-size: 12px;">▼</span>
            </div>
          </div>

          <!-- Metode Pembayaran -->
          <div style="margin-bottom: 16px;">
            <label style="font-size: 13px; font-weight: 700; color: #374151; display: block; margin-bottom: 8px;">Metode Pembayaran</label>
            <div style="display: flex; flex-wrap: wrap; gap: 6px;">
              <div style="background: #5B4DFF; color: #FFF; border-radius: 16px; padding: 6px 12px; font-size: 11.5px; font-weight: 700;">Tunai</div>
              <div style="background: #FFF; border: 1px solid #E5E7EB; color: #374151; border-radius: 16px; padding: 6px 12px; font-size: 11.5px; font-weight: 600;">E-Money</div>
              <div style="background: #FFF; border: 1px solid #E5E7EB; color: #374151; border-radius: 16px; padding: 6px 12px; font-size: 11.5px; font-weight: 600;">Transfer Bank</div>
              <div style="background: #FFF; border: 1px solid #E5E7EB; color: #374151; border-radius: 16px; padding: 6px 12px; font-size: 11.5px; font-weight: 600;">M-Banking</div>
            </div>
          </div>

          <!-- Tanggal & Catatan -->
          <div style="margin-bottom: 14px;">
            <label style="font-size: 13px; font-weight: 700; color: #374151; display: block; margin-bottom: 6px;">Tanggal</label>
            <div style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;">
              <span style="font-size: 13px; color: #172033;">02/11/2026</span>
              <span style="color: #4F46E5;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></span>
            </div>
          </div>

          <div style="margin-bottom: 16px;">
            <label style="font-size: 13px; font-weight: 700; color: #374151; display: block; margin-bottom: 6px;">Catatan</label>
            <div style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 14px; padding: 12px 14px; font-size: 13px; color: #172033;">
              Makan malam bersama tim kantor
            </div>
          </div>
        </div>

        <div style="width: 100%; height: 50px; background: #5B4DFF; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 15px; font-weight: 800; box-shadow: 0 4px 12px rgba(91,77,255,0.35); cursor: pointer;">
          Simpan Transaksi
        </div>
      </div>
      <div class="bottom-home-bar"></div>
    </div>

</body>
</html>
